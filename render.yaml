services:
  - type: web
    name: store-rating-system
    runtime: node
    plan: free
    buildCommand: npm run install-all && npm run build
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: postgres
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DATABASE_URL
        fromDatabase:
          name: store-rating-db
          property: internalDatabaseUrl
      - key: PORT
        fromService:
          type: web
          name: store-rating-system
          property: port

databases:
  - name: store-rating-db
    plan: free
    databaseName: store_rating_db
    user: store_rating_user

